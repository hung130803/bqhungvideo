name: Build Windows app

# Chạy khi đẩy 1 tag dạng v* (vd v1.0.1) -> build .exe + tạo Release tự động.
# Máy người dùng (đã cài app) sẽ thấy thông báo "có bản mới" và tải từ Release này.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # cho phép bấm chạy tay trên GitHub

permissions:
  contents: write              # để tạo Release + upload file

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      BQ_VALIDATION_DIR: ${{ runner.temp }}/bqhung-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Các cổng đối chứng đọc tag lịch sử bằng git show.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện (bản gọn cho .exe)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller==6.22.2
          pip install pyflakes

      - name: Tải ffmpeg + yt-dlp (kèm theo app cho máy chưa có)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          # Bản NIGHTLY: vá lỗi YouTube (403/chữ ký) nhanh hơn bản release nhiều tuần
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff -Force
          $ff = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName bin/ffmpeg.exe
          Copy-Item $fp.FullName bin/ffprobe.exe
          Get-ChildItem bin

      - name: Kiểm tra lỗi tên biến
        shell: pwsh
        run: |
          $lint = python -m pyflakes app config.py main.py 2>&1
          $lint | Write-Output
          if ($lint -match 'undefined name|referenced before assignment|SyntaxError') { exit 1 }
          exit 0

      - name: Kiểm thử hồi quy và UI cách ly
        run: python tools/validate_repairs.py

      - name: Kiểm tra phiên bản trước phát hành
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python tools/check_release.py '${{ github.ref_name }}'

      # LƯU Ý (lỗi thật 08/08/2026): CHÍNH KHỐI `--add-data` DƯỚI ĐÂY là thứ
      # quyết định máy nhân viên có tài nguyên gì — `BQHungVideo.spec` bị
      # .gitignore nên KHÔNG dự phần vào bản phát hành. Sót 1 dòng ở đây là
      # TÍNH NĂNG BIẾN MẤT LẶNG LẼ, app không báo một dòng lỗi nào:
      # `app/assets/hieu_ung` từng bị bỏ sót -> bản .exe mất 25 hiệu ứng
      # frei0r (kho co còn 14), mất 21 chuyển cảnh GPU (thiếu
      # gl_transitions.cl), mất 6 shader, và mất luôn NGUON_GIAY_PHEP.md —
      # file ghi nguồn + GIẤY PHÉP GPL/LGPL của frei0r, bắt buộc phải kèm.
      # Cổng `_test_dong_goi.py` quét file này, thêm tài nguyên mới mà quên
      # khai là FAIL.
      - name: Đóng gói (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name "BQHungVideo"
          --collect-all PyQt6
          --collect-submodules app
          --collect-all google.generativeai
          --collect-all edge_tts
          --hidden-import openai
          --hidden-import requests
          --hidden-import psutil
          --hidden-import dotenv
          --add-data "app/database/schema.sql;app/database"
          --add-data "app/assets/fonts;app/assets/fonts"
          --add-data "app/assets/sfx;app/assets/sfx"
          --add-data "app/assets/hieu_ung;app/assets/hieu_ung"
          --add-data "app/core/potoken_plugins;app/core/potoken_plugins"
          --add-data ".env.example;."
          --add-data "LICENSES.txt;."
          --add-binary "bin/ffmpeg.exe;."
          --add-binary "bin/ffprobe.exe;."
          --add-binary "bin/yt-dlp.exe;."
          main.py

      - name: Dọn DỮ LIỆU thừa (giảm ~100MB, an toàn tuyệt đối - chỉ xóa data)
        shell: pwsh
        run: |
          $int = "dist/BQHungVideo/_internal"
          # ~100MB JSON discovery cache của googleapiclient: google.generativeai
          # (Gemini) dùng gRPC generativelanguage, KHÔNG đọc mấy file JSON này.
          # Chỉ xóa DATA (không đụng code import) -> zero rủi ro.
          Remove-Item -Recurse -Force "$int/googleapiclient/discovery_cache/documents" -EA SilentlyContinue
          # Qt6 translations (.qm) — app dùng tiếng Việt tự viết, không dùng
          Remove-Item -Recurse -Force "$int/PyQt6/Qt6/translations" -EA SilentlyContinue
          Write-Host "Dung luong sau don:"
          "{0:N0} MB" -f ((Get-ChildItem dist/BQHungVideo -Recurse | Measure-Object Length -Sum).Sum/1MB)

      - name: Kiểm tra EXE đóng gói trước khi phát hành
        shell: pwsh
        run: |
          $env:BQ_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bqhung-exe-check'
          $env:BQ_DB_PATH = Join-Path $env:BQ_DATA_DIR 'studio.db'
          $env:BQ_QSETTINGS_INI = Join-Path $env:BQ_DATA_DIR 'settings.ini'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:BQ_BO_MANG = '1'
          $env:HF_HUB_OFFLINE = '1'
          $env:TRANSFORMERS_OFFLINE = '1'
          New-Item -ItemType Directory -Force $env:BQ_DATA_DIR | Out-Null
          $report = Join-Path $env:BQ_DATA_DIR 'result.json'
          $exe = (Resolve-Path 'dist/BQHungVideo/BQHungVideo.exe').Path
          $checkProcess = Start-Process -FilePath $exe -ArgumentList '--self-check', ('"' + $report + '"') -WindowStyle Hidden -PassThru -Wait
          if ($checkProcess.ExitCode -ne 0) { throw 'EXE self-check failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (!$result.ok) { throw 'EXE self-check did not pass' }
          $expected = python -c 'from app.version import __version__; print(__version__)'
          if ($result.version -ne $expected) { throw 'Packaged version mismatch' }
          Get-Content -LiteralPath $report
          python _test_dong_goi.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged resources check failed' }

      - name: Lưu kết quả kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/bqhung-validation/*.log
            ${{ runner.temp }}/bqhung-validation/*.json
            ${{ runner.temp }}/bqhung-exe-check/result.json
          retention-days: 14

      - name: Nén thư mục app
        shell: bash
        run: |
          cd dist
          7z a -tzip "BQHungVideo-${{ github.ref_name }}.zip" "BQHungVideo"

      - name: Tạo Release + upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BQHungVideo-*.zip
          # GHI CHÚ PHÁT HÀNH VIẾT CHO NGƯỜI DÙNG, KHÔNG PHẢI DANH SÁCH COMMIT.
          # `generate_release_notes: true` dán y nguyên tiêu đề commit vào phần
          # mô tả bản phát hành — tức anh Hùng mở trang tải về sẽ đọc phải
          # những dòng kiểu "cong 79 `_test_gom_giong.py`: DAT 58". Đó là chữ
          # viết cho lập trình viên. Nay lấy `docs/GHI_CHU_PHAT_HANH.md`, viết
          # bằng tiếng Việt theo đúng cái người dùng BẤM THẤY.
          # Sửa file đó MỖI LẦN phát hành, đừng để nó nói về bản cũ.
          body_path: docs/GHI_CHU_PHAT_HANH.md
          generate_release_notes: false
